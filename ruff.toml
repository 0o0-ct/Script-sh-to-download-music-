line-length = 120
target-version = "py310"

[lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E741", "F401", "F811", "F841", "F541"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"__main__.py" = ["E402"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
