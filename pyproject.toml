[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "otterrip-core"
version = "7.8.0"
dependencies = ["mutagen", "yt-dlp"]

[project.optional-dependencies]
chromaprint = ["pyacoustid"]
full = ["pyacoustid", "aiohttp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lib"]
