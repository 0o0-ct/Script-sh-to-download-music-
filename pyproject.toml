[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "otterrip-core"
version = "7.9.0"
dependencies = ["mutagen", "yt-dlp", "typer", "rich"]

[project.optional-dependencies]
chromaprint = ["pyacoustid"]
full = ["pyacoustid", "aiohttp", "textual"]
dashboard = ["textual"]

[project.scripts]
otterrip = "otterrip_core.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lib"]
